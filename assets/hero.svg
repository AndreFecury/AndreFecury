<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="André Fecury — Software QA &amp; Test Engineer Intern">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2530"/><stop offset="1" stop-color="#103846"/></linearGradient>
  <linearGradient id="negro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1C14"/><stop offset="1" stop-color="#160E0A"/></linearGradient>
  <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A464"/><stop offset="1" stop-color="#B7793A"/></linearGradient>
  <clipPath id="r"><rect x="740" y="40" width="420" height="300" rx="22"/></clipPath>
  <style>
    .w1{animation:f 9s ease-in-out infinite alternate} .w2{animation:f 13s ease-in-out infinite alternate-reverse}
    .l{animation:s 7s linear infinite}
    .c{opacity:0;animation:in .6s ease-out forwards} .c1{animation-delay:.4s} .c2{animation-delay:.9s} .c3{animation-delay:1.4s}
    @keyframes f{from{transform:translateX(0)}to{transform:translateX(-90px)}}
    @keyframes s{from{transform:translateX(0)}to{transform:translateX(-200px)}}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.w1,.w2,.l{animation:none} .c{opacity:1;animation:none}}
  </style>
</defs>
<rect width="1200" height="380" rx="26" fill="url(#bg)"/>
<text x="64" y="92" fill="#8FC7D6" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="3">OLÁ, EU SOU O</text>
<text x="62" y="160" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1">André Fecury</text>
<text x="64" y="206" fill="#E2B071" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="600">Software QA &amp; Test Engineer Intern</text>
<text x="64" y="244" fill="#D7E6E4" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19">Sidia · Samsung   |   Ciência da Computação · UNIP</text>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D7E6E4">
  <rect x="64" y="276" width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="148" y="299" text-anchor="middle">Manaus · Amazonas</text>
  <rect x="244" y="276" width="156" height="36" rx="18" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="322" y="299" text-anchor="middle">Testes e Qualidade</text>
  <rect x="412" y="276" width="150" height="36" rx="18" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="487" y="299" text-anchor="middle">Android · Python</text>
</g>
<g clip-path="url(#r)">
  <rect x="740" y="40" width="420" height="300" fill="url(#negro)"/>
  <path class="w1" fill="url(#sol)" d="M740 210 C 800 180, 860 240, 920 205 S 1040 170, 1100 210 S 1220 240, 1290 205 L 1290 340 L 740 340 Z"/>
  <path class="w2" fill="#C98E4E" fill-opacity=".55" d="M740 250 C 810 230, 880 275, 950 245 S 1080 220, 1150 250 S 1260 270, 1290 250 L 1290 340 L 740 340 Z"/>
  <g class="l" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="2" fill="none">
    <path d="M740 110 q 25 -10 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0"/>
    <path d="M740 150 q 25 -10 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0"/>
  </g>
  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15">
    <g class="c c1"><rect x="770" y="66" width="230" height="34" rx="9" fill="#0B2530" fill-opacity=".86"/><text x="786" y="88" fill="#7FE0A6">✔</text><text x="808" y="88" fill="#D7E6E4">firmware validado</text></g>
    <g class="c c2"><rect x="800" y="110" width="250" height="34" rx="9" fill="#0B2530" fill-opacity=".86"/><text x="816" y="132" fill="#7FE0A6">✔</text><text x="838" y="132" fill="#D7E6E4">testes de regressão</text></g>
    <g class="c c3"><rect x="830" y="154" width="270" height="34" rx="9" fill="#0B2530" fill-opacity=".86"/><text x="846" y="176" fill="#7FE0A6">✔</text><text x="868" y="176" fill="#D7E6E4">automação em Python</text></g>
  </g>
  <text x="1140" y="326" text-anchor="end" fill="#FFFFFF" fill-opacity=".7" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1">ENCONTRO DAS ÁGUAS · MANAUS</text>
</g>
</svg>